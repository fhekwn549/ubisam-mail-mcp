[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubisam-mail-mcp"
version = "0.1.0"
description = "SMTP-backed MCP server for composing, drafting, scheduling, and sending Ubisam groupware mail"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = ["mcp>=1.2"]

[project.scripts]
ubisam-mail-mcp = "ubisam_mail_mcp.server:main"
ubisam-mail-mcp-setup = "ubisam_mail_mcp.setup_wizard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
